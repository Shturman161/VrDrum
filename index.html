<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drum VR</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#555;--card:#f1f3f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--fg:#eee;--mut:#9aa3b0;--card:#222630}}
:root[data-theme="dark"]{--bg:#15171c;--fg:#eee;--mut:#9aa3b0;--card:#222630}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
main{max-width:30rem;padding:1.5rem}
button{font:inherit;font-weight:600;padding:.9rem 1.6rem;border:0;border-radius:12px;background:#2b6cff;color:#fff;width:100%}
button.alt{background:var(--card);color:var(--fg);margin-top:.6rem}
button:disabled{opacity:.4}
.card{background:var(--card);border-radius:12px;padding:.8rem 1rem;margin:1rem 0;color:var(--mut);font-size:.95rem}
</style></head><body><main>
<h1>🥁 Drum VR</h1>
<p>Тренажёр: ноты идут в окне, ты бьёшь по установке.</p>
<div class="card" id="st">Проверяю AR…</div>
<div class="card" id="midi">MIDI: проверяю…</div>
<button id="go" disabled>Войти в AR</button>
<button id="rst" class="alt">Сбросить ноты и расстановку</button>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const INST=[['hc','хэт закрытый','hihat',0,0xffd23f],['ho','хэт открытый','hihat',0,0xffd23f],
 ['cl','крэш левый','crashL',1,0xffffff],['cr','крэш правый','crashR',1,0xffffff],['rd','райд','ride',1,0xc0c0ff],
 ['sn','малый','snare',2,0xff5a5f],['t1','том 1','tom1',3,0x3ddc97],['t2','том 2','tom2',3,0x2bb6ff],
 ['tf','напольный том','floor',3,0xff9f1c],['kk','бочка','kick',4,0x8e7dff]];
const IN={};INST.forEach(a=>IN[a[0]]={id:a[0],n:a[1],pad:a[2],lane:a[3],c:a[4],m:null});
const PADS={
 hihat:{p:[-.55,.85,-.8],c:0xffd23f,r:.14},snare:{p:[-.2,.75,-.65],c:0xff5a5f,r:.16},
 tom1:{p:[-.15,1,-.85],c:0x3ddc97,r:.13},tom2:{p:[.2,1,-.85],c:0x2bb6ff,r:.13},
 floor:{p:[.5,.7,-.7],c:0xff9f1c,r:.17},crashL:{p:[-.55,1.2,-.9],c:0xffffff,r:.14},
 crashR:{p:[.05,1.3,-.95],c:0xffffff,r:.14},ride:{p:[.55,1.15,-.9],c:0xc0c0ff,r:.15},
 kick:{p:[0,.25,-.65],c:0x8e7dff,r:.16}};
const PK=Object.keys(PADS);
const LEN=8,PAT=[];const add=(id,...bs)=>bs.forEach(b=>PAT.push([b,id]));
for(let b=0;b<6;b+=.5)add(b===3.5?'ho':'hc',b);
add('rd',6,6.5);add('kk',0,2,2.5,4,6);add('sn',1,3,5,7);add('cl',0);add('cr',4);add('t1',6.5);add('t2',7);add('tf',7.5);
let bpm=80,lat=0,clickOn=false,startHit=false;
const sN=ls.get('drumvr-notes2'),sL=ls.get('drumvr-layout2');
if(sN)INST.forEach(a=>IN[a[0]].m=sN[a[0]]!=null?sN[a[0]]:null);
if(sL){bpm=sL.bpm||80;lat=sL.lat||0;clickOn=!!sL.click;startHit=!!sL.startHit;for(const k of PK)if(sL.pads&&sL.pads[k]){PADS[k].p=sL.pads[k].p;PADS[k].r=sL.pads[k].r;}}

const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(70,1,.01,20);
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
renderer.xr.enabled=true;renderer.setClearColor(0,0);
for(const k of PK){const d=PADS[k];
 d.mat=new THREE.MeshBasicMaterial({color:d.c,transparent:true,opacity:.35});
 d.mesh=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.015,32),d.mat);scene.add(d.mesh);d.flash=0;
 d.fbc=document.createElement('canvas');d.fbc.width=256;d.fbc.height=80;d.fbt=new THREE.CanvasTexture(d.fbc);
 d.fb=new THREE.Sprite(new THREE.SpriteMaterial({map:d.fbt,transparent:true,depthTest:false,opacity:0}));d.fb.scale.set(.24,.075,1);scene.add(d.fb);d.fbT=0;}
function fbDraw(d,t,col){const g=d.fbc.getContext('2d');g.clearRect(0,0,256,80);g.font='bold 54px sans-serif';g.textAlign='center';g.textBaseline='middle';
 g.lineWidth=8;g.strokeStyle='#000';g.strokeText(t,128,42);g.fillStyle=col;g.fillText(t,128,42);d.fbt.needsUpdate=true;d.fbT=1;}
function fit(d){const s=d.r*(1+d.flash*.25);d.mesh.scale.set(s,1,s);d.mesh.position.set(...d.p);}
function mk(par,w,h,cw,ch,pos){const c=document.createElement('canvas');c.width=cw;c.height=ch;const t=new THREE.CanvasTexture(c);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));s.scale.set(w,h,1);s.position.set(...pos);par.add(s);return{s,c,t};}
function draw(o,lines,bg,fs){const g=o.c.getContext('2d'),w=o.c.width,h=o.c.height;g.clearRect(0,0,w,h);g.fillStyle=bg;g.fillRect(0,0,w,h);g.textAlign='center';g.textBaseline='alphabetic';
 lines.forEach((l,i)=>{g.font=(i?(fs?fs-6:34):'bold '+(fs||40))+'px sans-serif';g.fillStyle=i?'#ccc':'#fff';g.fillText(l,w/2,lines.length>1?h*(.4+i*.3):h*.62);});o.t.needsUpdate=true;}

// Значки нот
const TX={};INST.forEach(a=>{const id=a[0],c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),col='#'+a[4].toString(16).padStart(6,'0');
 g.lineWidth=9;g.strokeStyle=g.fillStyle=col;g.lineCap='round';
 const circ=f=>{g.beginPath();g.arc(64,64,48,0,7);f?g.fill():g.stroke();},
  X=s=>{g.strokeStyle=s;g.lineWidth=9;g.beginPath();g.moveTo(40,40);g.lineTo(88,88);g.moveTo(88,40);g.lineTo(40,88);g.stroke();},
  T=s=>{g.fillStyle='#111';g.font='bold 60px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(s,64,68);};
 if(id==='hc'){circ(1);X('#111');}else if(id==='ho'){circ(0);X(col);}
 else if(id==='rd'){g.beginPath();g.moveTo(64,10);g.lineTo(118,64);g.lineTo(64,118);g.lineTo(10,64);g.closePath();g.fill();}
 else if(id==='kk'){g.fillRect(8,46,112,36);}
 else{circ(1);if(id==='cl')T('Л');if(id==='cr')T('П');if(id==='t1')T('1');if(id==='t2')T('2');if(id==='tf')T('Н');}
 TX[id]=new THREE.CanvasTexture(c);});
const NG=new THREE.PlaneGeometry(.1,.1);

// Окно: двигается, масштабируется (угол справа) и поворачивается (угол слева)
const LW=.13,NL=5,WW=NL*LW+.06,WH=.9,HITY=-WH/2+.1,TOPY=WH/2-.05,VIS=4,WIN=160,CORNER=Math.hypot(WW/2,WH/2),BY=-.74;
const laneX=l=>-NL*LW/2+LW*(l+.5);
const W=new THREE.Group();scene.add(W);W.position.set(0,1.25,-1.3);if(sL&&sL.ws)W.scale.setScalar(sL.ws);
function plane(w,h,col,op,x,y,z){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,depthWrite:false}));m.position.set(x,y,z||0);W.add(m);return m;}
plane(WW,WH,0,.5,0,0,-.002);
for(let i=0;i<=NL;i++)plane(.003,WH-.04,0xffffff,.3,-NL*LW/2+i*LW,0,0);
const LZ=[];for(let l=0;l<NL;l++){const m=plane(LW-.01,.07,0xffffff,.15,laneX(l),HITY,.001);m.fl=0;LZ.push(m);}
const HL=plane(NL*LW,.006,0xffffff,.9,0,HITY,.002);
const corner=new THREE.Mesh(new THREE.SphereGeometry(.025),new THREE.MeshBasicMaterial({color:0xffffff}));corner.position.set(WW/2,WH/2,.01);W.add(corner);
const rot=new THREE.Mesh(new THREE.SphereGeometry(.025),new THREE.MeshBasicMaterial({color:0xff9f1c}));rot.position.set(-WW/2,WH/2,.01);W.add(rot);
const LB=mk(W,.71,.045,1024,64,[0,HITY-.075,.003]);
{const g=LB.c.getContext('2d');g.font='bold 34px sans-serif';g.fillStyle='#ccc';g.textAlign='center';['хэт','тарелки','малый','томы','бочка'].forEach((t,l)=>g.fillText(t,512+laneX(l)/.71*1024,44));LB.t.needsUpdate=true;}
// Подсказки справа от окна: значок и название
const GX=WW/2+.26;plane(.42,.84,0,.4,GX,0,-.002);
const GL=mk(W,.3,.8,300,800,[GX+.05,0,.003]);
{const g=GL.c.getContext('2d');g.font='32px sans-serif';g.fillStyle='#fff';g.textAlign='left';INST.forEach((a,i)=>g.fillText(a[1],8,i*80+50));GL.t.needsUpdate=true;}
INST.forEach((a,i)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(.06,.06),new THREE.MeshBasicMaterial({map:TX[a[0]],transparent:true,depthWrite:false}));m.position.set(GX-.15,.36-i*.08,.004);W.add(m);});
const L=mk(W,.8,.2,1024,256,[0,WH/2+.12,.004]),HD=mk(W,.71,.139,1024,200,[0,WH/2+.1,.003]);
const SL=[{y:-WH/2-.06,min:40,max:200,fmt:v=>'BPM '+Math.round(v),get:()=>bpm,set:v=>bpm=Math.round(v)},
 {y:-WH/2-.16,min:-60,max:160,fmt:v=>'Задержка '+(v>=0?'+':'')+Math.round(v)+' мс',get:()=>lat,set:v=>lat=Math.round(v)}];
SL.forEach(s=>{plane(.58,.008,0xffffff,.6,0,s.y,0);s.h=new THREE.Mesh(new THREE.SphereGeometry(.022),new THREE.MeshBasicMaterial({color:0x2b6cff}));W.add(s.h);
 s.l=mk(W,.5,.0625,512,64,[-.04,s.y+.045,.003]);
 s.upd=()=>{const f=Math.min(1,Math.max(0,(s.get()-s.min)/(s.max-s.min)));s.h.position.set(-.29+f*.58,s.y,.01);draw(s.l,[s.fmt(s.get())],'rgba(0,0,0,0)');};});
const AB=mk(W,.1,.05,256,128,[.3,SL[1].y+.045,.003]);draw(AB,['авто'],'rgba(43,108,255,.9)');

let mode='idle',li=0,lastNote=null,cand=null,candT=0,grab=null,notes=[],made=new Set(),pos=0,prevPos=0,noteMap={},raws=[],missN=0,armed=false,pulse=0,fr=0,last=performance.now(),frameT=last;
function rebuild(){noteMap={};INST.forEach(a=>{if(IN[a[0]].m!=null)noteMap[IN[a[0]].m]=a[0];});}rebuild();
function stats(){if(!raws.length)return{mu:0,sd:0};const e=raws.map(r=>r-lat),mu=e.reduce((s,x)=>s+x,0)/e.length;return{mu,sd:Math.sqrt(e.reduce((s,x)=>s+(x-mu)*(x-mu),0)/e.length)};}
// Оценка: не «хорошо/плохо», а ровность: разброс ударов относительно сетки и сдвиг от неё
function hud(){const st=stats(),g=HD.c.getContext('2d');g.clearRect(0,0,1024,200);g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,1024,200);
 g.textAlign='center';g.fillStyle='#fff';g.font='bold 36px sans-serif';
 g.fillText(raws.length?'ровность ±'+Math.round(st.sd)+' мс · сдвиг '+(st.mu>=0?'+':'')+Math.round(st.mu)+' мс · мимо '+missN:'ровность появится после первых ударов',512,52);
 g.strokeStyle='#888';g.lineWidth=3;g.beginPath();g.moveTo(112,130);g.lineTo(912,130);g.stroke();
 g.strokeStyle='#fff';g.beginPath();g.moveTo(512,100);g.lineTo(512,160);g.stroke();g.fillStyle='#3ddc97';
 raws.forEach((r,i)=>{const e=Math.max(-150,Math.min(150,r-lat));g.globalAlpha=.25+.75*(i+1)/raws.length;g.fillRect(512+e/150*400-4,108,8,44);});g.globalAlpha=1;
 g.font='28px sans-serif';g.fillStyle='#ccc';g.fillText('раньше',112,188);g.fillText('позже',912,188);HD.t.needsUpdate=true;}
function usedBy(n){return noteMap[n];}
function ui(){
 if(mode==='learn'){const u=cand&&usedBy(cand.n);
  draw(L,['Ударь по: '+INST[li][1]+' ('+(li+1)+'/'+INST.length+')',cand?'нота '+cand.n+' · сила '+cand.v+(u?' · уже занята: '+IN[u].n:' · нажми «Принять»'):'жду удара'],'rgba(0,0,0,.65)');}
 if(mode==='layout')draw(L,['Двигай круги и окно пальцами','края окна: справа размер, слева поворот'],'rgba(0,0,0,.65)');
 if(mode==='play'&&armed)draw(L,['Включи метроном на модуле: '+bpm+' BPM','ударь по любому пэду на «раз»'],'rgba(0,0,0,.65)');
 L.s.visible=mode!=='play'||armed;HD.s.visible=mode==='play'&&!armed;refresh();}
const BT=[
 {x:-.27,vis:()=>true,lab:()=>mode==='learn'?'Назад':'Клик: '+(clickOn?'вкл':'выкл'),col:()=>'rgba(90,90,90,.9)',
  go(){if(mode==='learn'){li=Math.max(0,li-1);cand=null;IN[INST[li][0]].m=null;rebuild();ui();}else{clickOn=!clickOn;if(clickOn)click(1);save();refresh();}}},
 {x:-.09,vis:()=>mode!=='learn',lab:()=>'Старт: '+(startHit?'удар':'сразу'),col:()=>'rgba(90,90,90,.9)',go(){startHit=!startHit;save();refresh();}},
 {x:.09,vis:()=>true,lab:()=>'К себе',col:()=>'rgba(90,90,90,.9)',go(){faceMe();}},
 {x:.27,vis:()=>true,lab:()=>mode==='learn'?(cand&&!usedBy(cand.n)?'Принять':'Пропустить'):mode==='layout'?'Готово':'Настроить',
  col:()=>mode==='play'?'rgba(43,108,255,.9)':'rgba(30,150,80,.9)',
  go(){if(mode==='learn'){if(cand&&!usedBy(cand.n)){IN[INST[li][0]].m=cand.n;rebuild();}cand=null;nextLearn();}else if(mode==='layout'){save();setMode('play');}else setMode('layout');}}];
BT.forEach(b=>b.o=mk(W,.17,.06,256,90,[b.x,BY,.003]));
function refresh(){BT.forEach(b=>{b.o.s.visible=b.vis();if(b.vis())draw(b.o,[b.lab()],b.col(),30);});}
function setSl(s,x){const f=Math.min(1,Math.max(0,(x+.29)/.58));s.set(s.min+f*(s.max-s.min));s.upd();if(armed)ui();}
function setMode(m){mode=m;notes.forEach(n=>W.remove(n.m));notes=[];made.clear();armed=false;
 if(m==='play'){pos=-4;prevPos=pos;last=performance.now();raws=[];missN=0;armed=startHit;}
 if(m==='layout')pos=0;
 hud();SL.forEach(s=>s.upd());ui();}
function save(){const o={pads:{},ws:W.scale.x,bpm,lat,click:clickOn,startHit};PK.forEach(k=>o.pads[k]={p:PADS[k].p,r:PADS[k].r});ls.set('drumvr-layout2',o);}
function nextLearn(){li++;if(li>=INST.length){const o={};INST.forEach(a=>o[a[0]]=IN[a[0]].m);ls.set('drumvr-notes2',o);setMode('layout');}else ui();}
function faceMe(){const p=camera.getWorldPosition(new THREE.Vector3()),d=camera.getWorldDirection(new THREE.Vector3());d.y=0;if(d.length()<.1)return;d.normalize();
 W.position.set(p.x+d.x*1.1,p.y-.05,p.z+d.z*1.1);W.rotation.y=Math.atan2(-d.x,-d.z);}

// Метроном: вспышка линии на каждую долю и (по желанию) звук в динамиках шлема
let ac=null;
function click(acc){if(!clickOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
 o.frequency.value=acc?1500:1000;g.gain.setValueAtTime(.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.05);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.06);}catch(e){}}

function hit(id,evT){const evPos=pos+(evT-frameT)/1000*bpm/60;let best=null,bd=1e9,rw=0;
 for(const n of notes){if(n.st||n.id!==id)continue;const e=(evPos-n.t)*60000/bpm;if(Math.abs(e-lat)<Math.abs(bd)){bd=e-lat;rw=e;best=n;}}
 if(best&&Math.abs(bd)<=WIN){best.st=1;raws.push(rw);if(raws.length>24)raws.shift();const st=stats(),dev=Math.abs(bd-st.mu),i=IN[id];
  fbDraw(PADS[i.pad],(bd>=0?'+':'−')+Math.round(Math.abs(bd)),dev<=20?'#3ddc97':dev<=40?'#ffd23f':'#ff9f1c');
  LZ[i.lane].material.color.set('#3ddc97');LZ[i.lane].fl=1;hud();}}
function updNotes(){
 for(let l=Math.floor((pos-1)/LEN);l<=Math.floor((pos+VIS)/LEN);l++)PAT.forEach(([b,id],i)=>{const t=l*LEN+b,key=l+':'+i;
  if(t>=pos-.3&&t<=pos+VIS&&!made.has(key)){made.add(key);const m=new THREE.Mesh(NG,new THREE.MeshBasicMaterial({map:TX[id],transparent:true,depthWrite:false}));W.add(m);notes.push({t,id,m,st:0});}});
 notes=notes.filter(n=>{const y=HITY+(n.t-pos)/VIS*(TOPY-HITY);
  if(n.st===0&&mode==='play'&&!armed&&(pos-n.t)*60000/bpm-lat>WIN){n.st=2;n.m.material.opacity=.25;missN++;fbDraw(PADS[IN[n.id].pad],'мимо','#ff5a5f');LZ[IN[n.id].lane].material.color.set('#ff5a5f');LZ[IN[n.id].lane].fl=1;hud();}
  if(n.st===1||y<HITY-.15){W.remove(n.m);return false;}
  n.m.position.set(laneX(IN[n.id].lane),y,.005);return true;});}

// MIDI. В режиме обучения берём самый сильный удар за 300 мс (слабые это наводки с соседних пэдов)
function onMidi(e){const [s,n,v]=e.data;if((s&0xf0)!==0x90||v===0)return;lastNote=n;
 if(mode==='learn'){const t=performance.now();if(!cand||t-candT>300){cand={n,v};candT=t;}else if(v>cand.v)cand={n,v};ui();return;}
 const id=noteMap[n];if(!id)return;PADS[IN[id].pad].flash=1;
 if(mode==='play'){if(armed){armed=false;pos=-4+(performance.now()-e.timeStamp)/1000*bpm/60;prevPos=pos;ui();return;}hit(id,e.timeStamp);}}
function hook(a){[...a.inputs.values()].forEach(i=>i.onmidimessage=onMidi);}
try{navigator.requestMIDIAccess().then(a=>{hook(a);const n=[...a.inputs.values()].map(i=>i.name);
 $("midi").textContent=n.length?"MIDI: найдено "+n.join(", "):"MIDI: устройств нет";a.onstatechange=()=>hook(a);
}).catch(()=>$("midi").textContent="MIDI: нет доступа");}catch(e){$("midi").textContent="MIDI: не поддерживается";}

// Щипок пальцами (или контроллер)
const ctl=[0,1].map(i=>{const c=renderer.xr.getController(i);scene.add(c);return c;});
const hands=[0,1].map(i=>{const h=renderer.xr.getHand(i);scene.add(h);return h;});
const P=v=>new THREE.Vector3(...v);
function pointer(i){const j=hands[i].joints||{},a=j['index-finger-tip'],b=j['thumb-tip'];
 if(a&&b&&a.visible&&b.visible)return a.position.clone().add(b.position).multiplyScalar(.5);
 return ctl[i].getWorldPosition(new THREE.Vector3());}
const near=(q,x,y,r)=>Math.hypot(q.x-x,q.y-y)<r&&Math.abs(q.z)<.1;
[0,1].forEach(i=>{
 ctl[i].addEventListener('selectstart',()=>{const p=pointer(i);W.updateMatrixWorld(true);const q=W.worldToLocal(p.clone());
  if(Math.abs(q.z)<.1){
   for(const b of BT)if(b.vis()&&Math.abs(q.x-b.x)<.085&&Math.abs(q.y-BY)<.04){b.go();return;}
   if(Math.abs(q.x-.3)<.05&&Math.abs(q.y-(SL[1].y+.045))<.035){if(raws.length){lat=Math.round(raws.reduce((a,b)=>a+b,0)/raws.length);SL[1].upd();hud();save();}return;}
   for(const s of SL)if(Math.abs(q.y-s.y)<.05&&Math.abs(q.x)<.31){grab={i,t:'sl',s};setSl(s,q.x);return;}}
  if(mode==='play')return;
  if(mode==='layout'){let best=null,bd=9;for(const k of PK){const d=PADS[k],x=p.distanceTo(P(d.p));if(x<d.r*1.5&&x<bd){best=k;bd=x;}}
   if(best){const d=PADS[best];grab={i,t:'pad',k:best,size:bd>d.r*.6,off:P(d.p).sub(p)};return;}}
  if(near(q,WW/2,WH/2,.09)){grab={i,t:'size'};return;}
  if(near(q,-WW/2,WH/2,.09)){const v=p.clone().sub(W.position);grab={i,t:'rot',a0:Math.atan2(v.x,v.z),r0:W.rotation.y};return;}
  if(Math.abs(q.x)<WW/2&&Math.abs(q.y)<WH/2&&Math.abs(q.z)<.1)grab={i,t:'win',off:W.position.clone().sub(p)};});
 ctl[i].addEventListener('selectend',()=>{if(grab&&grab.i===i){grab=null;save();}});});
function doGrab(){const p=pointer(grab.i);
 if(grab.t==='pad'){const d=PADS[grab.k];if(grab.size)d.r=Math.min(.45,Math.max(.05,p.distanceTo(P(d.p))));else d.p=[p.x+grab.off.x,p.y+grab.off.y,p.z+grab.off.z];}
 else if(grab.t==='sl')setSl(grab.s,W.worldToLocal(p.clone()).x);
 else if(grab.t==='size')W.scale.setScalar(Math.min(3,Math.max(.4,p.distanceTo(W.position)/CORNER)));
 else if(grab.t==='rot'){const v=p.clone().sub(W.position);W.rotation.y=grab.r0+Math.atan2(v.x,v.z)-grab.a0;}
 else W.position.copy(p).add(grab.off);}

renderer.setAnimationLoop(()=>{
 const now=performance.now(),dt=Math.min((now-last)/1000,.1);last=now;frameT=now;
 if(!renderer.xr.isPresenting)return;
 if(++fr===3)faceMe();
 if(grab)doGrab();
 if(mode==='play'&&!armed){prevPos=pos;pos+=dt*bpm/60;if(Math.floor(pos)>Math.floor(prevPos)){const acc=((Math.floor(pos)%4)+4)%4===0;pulse=acc?1.5:1;click(acc);}}
 pulse=Math.max(0,pulse-dt*4);HL.material.opacity=.7+Math.min(.3,pulse*.3);HL.scale.y=1+pulse*3;
 updNotes();
 const cur=mode==='learn'?INST[li][2]:null;
 for(const k of PK){const d=PADS[k];d.flash=Math.max(0,d.flash-.06);
  d.mat.opacity=(mode==='learn'?(k===cur?.8:.15):.35)+d.flash*.6;fit(d);
  if(d.fbT>0){d.fbT-=dt*1.6;d.fb.material.opacity=Math.min(1,d.fbT*2);d.fb.position.set(d.p[0],d.p[1]+.17+(1-d.fbT)*.1,d.p[2]);}else d.fb.material.opacity=0;}
 LZ.forEach(m=>{m.fl=Math.max(0,m.fl-dt*4);m.material.opacity=.15+m.fl*.6+Math.min(.12,pulse*.1);});
 renderer.render(scene,camera);
});
